name: Deploy Azure Functions

on:
  push:
    branches:
      - main
    paths:
      - 'Functions/**'
      - 'Services/**'
      - 'Models/**'
      - 'Program.cs'
      - 'host.json'
      - 'StockAggregator.csproj'
      - 'StockAggregator.Tests/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore app
        run: dotnet restore StockAggregator.csproj

      - name: Restore tests
        run: dotnet restore StockAggregator.Tests/StockAggregator.Tests.csproj

      - name: Build
        run: dotnet build StockAggregator.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish StockAggregator.csproj --configuration Release --no-build --output ./publish

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.FUNCTION_APP_NAME }}
          package: ./publish

      # The deploy restarts the app, and on a consumption plan it answers 503 until the
      # host is back. Without this the smoke test raced the restart and failed a deploy
      # that was actually fine. Waiting here keeps the test itself a real assertion:
      # if the app never comes back, the loop expires and the step still fails.
      - name: Wait for the app to answer
        env:
          FUNCTION_APP_URL: ${{ secrets.FUNCTION_APP_URL }}
        run: |
          if [ -z "$FUNCTION_APP_URL" ]; then
            echo "Missing required secret: FUNCTION_APP_URL"
            exit 1
          fi
          url="${FUNCTION_APP_URL%/}/api/health"
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo 000)
            if [ "$code" = "200" ]; then
              echo "Healthy after ${attempt} attempt(s)."
              exit 0
            fi
            echo "Attempt ${attempt}: HTTP ${code} — retrying in 10s."
            sleep 10
          done
          echo "App did not return 200 within ~5 minutes."
          exit 1

      - name: Run deployment smoke test
        env:
          FUNCTION_APP_URL: ${{ secrets.FUNCTION_APP_URL }}
        run: |
          echo "Testing endpoint: $FUNCTION_APP_URL"
          dotnet test StockAggregator.Tests/StockAggregator.Tests.csproj --filter FullyQualifiedName~DeploymentSmokeTests
