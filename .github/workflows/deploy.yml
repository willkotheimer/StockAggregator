name: Deploy Azure Functions

on:
  push:
    branches:
      - main
    paths:
      - 'Functions/**'
      - 'Services/**'
      - 'Models/**'
      - 'Program.cs'
      - 'host.json'
      - 'StockAggregator.csproj'
      - 'StockAggregator.Tests/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore app
        run: dotnet restore StockAggregator.csproj

      - name: Restore tests
        run: dotnet restore StockAggregator.Tests/StockAggregator.Tests.csproj

      - name: Build
        run: dotnet build StockAggregator.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish StockAggregator.csproj --configuration Release --no-build --output ./publish

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.FUNCTION_APP_NAME }}
          package: ./publish

      # The deploy restarts the app, and on a consumption plan it answers 503 until the
      # host is back. Without this the smoke test raced the restart and failed a deploy
      # that was actually fine. Waiting here keeps the test itself a real assertion:
      # if the app never comes back, the loop expires and the step still fails.
      - name: Wait for the app to answer
        env:
          FUNCTION_APP_URL: ${{ secrets.FUNCTION_APP_URL }}
        run: |
          if [ -z "$FUNCTION_APP_URL" ]; then
            echo "Missing required secret: FUNCTION_APP_URL"
            exit 1
          fi
          # Take scheme+host only and hang /api/health off the root, mirroring the
          # smoke test's new Uri(baseUri, "/api/health"). Appending instead would
          # 404 whenever the secret carries any path of its own.
          origin=$(printf '%s' "$FUNCTION_APP_URL" | tr -d '[:space:]' | sed -E 's#^(https?://[^/]+).*#\1#')
          # A restarting host can 404 briefly while it re-indexes its functions, so a
          # short 404 window is tolerated. Past that it means the path is wrong, and
          # waiting the full five minutes would only delay the same failure.
          max_not_found=6
          not_found=0
          body=$(mktemp)

          for attempt in $(seq 1 30); do
            code=$(curl -s -o "$body" -w '%{http_code}' --max-time 20 "$origin/api/health") || code=000
            case "$code" in
              200)
                echo "Healthy after ${attempt} attempt(s)."
                exit 0
                ;;
              000|5*)
                not_found=0
                echo "Attempt ${attempt}: HTTP ${code} at /api/health — app starting, retrying in 10s."
                ;;
              404)
                not_found=$((not_found + 1))
                echo "Attempt ${attempt}: HTTP 404 at /api/health (${not_found}/${max_not_found} tolerated)."
                if [ "$not_found" -ge "$max_not_found" ]; then
                  echo "::error::/api/health kept returning 404, so the host is up but the route is not there."
                  echo "FUNCTION_APP_URL must be the app origin only — https://<app>.azurewebsites.net, no trailing path."
                  echo "Path component currently on the secret: '$(printf '%s' "$FUNCTION_APP_URL" | tr -d '[:space:]' | sed -E 's#^https?://[^/]+##')'"
                  head -c 300 "$body"; echo
                  exit 1
                fi
                ;;
              *)
                echo "::error::HTTP ${code} at /api/health — not a startup state."
                head -c 300 "$body"; echo
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::App did not return 200 within ~5 minutes."
          exit 1

      - name: Run deployment smoke test
        env:
          FUNCTION_APP_URL: ${{ secrets.FUNCTION_APP_URL }}
        run: |
          echo "Testing endpoint: $FUNCTION_APP_URL"
          dotnet test StockAggregator.Tests/StockAggregator.Tests.csproj --filter FullyQualifiedName~DeploymentSmokeTests
